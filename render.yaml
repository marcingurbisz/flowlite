services:
  - type: web
    name: flowlite-test-instance
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/flows
    envVars:
      - key: JDK_JAVA_OPTIONS
        value: "-Djdk.tracePinnedThreads=full"
      - key: FLOWLITE_DIAGNOSTICS_MEMORY_LOG_ENABLED
        value: "true"
      - key: FLOWLITE_DIAGNOSTICS_MEMORY_LOG_INTERVAL_SECONDS
        value: "60"
      - key: FLOWLITE_DIAGNOSTICS_THREAD_DUMP_ENABLED
        value: "true"
      - key: FLOWLITE_DIAGNOSTICS_THREAD_DUMP_INTERVAL_SECONDS
        value: "3600"
      - key: FLOWLITE_DIAGNOSTICS_HTTP_ACCESS_LOG_ENABLED
        value: "true"
      - key: FLOWLITE_DIAGNOSTICS_HTTP_ACCESS_LOG_INCLUDE_QUERY_STRING
        value: "true"
